    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }

<body>
  <div id="__bundler_placeholder">Loading Pinket: Dashboards...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

" style=\"font-weight:500\"\u003e← Back to work\u003c/a\u003e\n\u003cdiv style=\"margin-top:32px;display:flex;flex-wrap:wrap;gap:8px\"\u003e\u003cspan class=\"tg\" style=\"background:#fff;border:1px solid #E5E5E5\"\u003eResponsive web\u003c/span\u003e\u003cspan class=\"tg\" style=\"background:#fff;border:1px solid #E5E5E5\"\u003eB2B\u003c/span\u003e\u003cspan class=\"tg\" style=\"background:#fff;border:1px solid #E5E5E5\"\u003eCase study\u003c/span\u003e\u003c/div\u003e\n\u003ch1 style=\"margin-top:16px;font-size:clamp(44px,8vw,96px);line-height:1;font-weight:700;letter-spacing:-.02em\"\u003ePinket: Dashboards\u003c/h1\u003e\n\u003cp style=\"margin-top:16px;font-size:24px;color:#444\"\u003eAdmin, vendor, and organization dashboards\u003c/p\u003e\n\u003cdiv style=\"margin-top:40px;border-radius:24px;padding:clamp(16px,4vw,56px);background:linear-gradient(135deg,#0ACF83,#1ABCFE)\"\u003e\u003cdiv class=\"fr\" data-i=\"0\" style=\"box-shadow:0 32px 64px rgba(30,30,30,.35)\"\u003e\u003cdiv class=\"bar\"\u003e\u003ci\u003e\u003c/i\u003e\u003ci\u003e\u003c/i\u003e\u003ci\u003e\u003c/i\u003e\u003cspan\u003eyourproduct.com\u003c/span\u003e\u003c/div\u003e\u003cdiv style=\"height: clamp(220px,40vw,460px); background: url(\u0026quot;b5e58b75-2dbd-4c87-87af-efe40ed76f30\u0026quot;) center / cover no-repeat; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 500\"\u003e\u003cbr\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv style=\"margin-top:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));background:#fff;border:1px solid #E5E5E5;border-radius:16px;overflow:hidden\"\u003e\u003cdiv style=\"padding:20px 24px\"\u003e\u003cp style=\"font-size:13px;color:#555\"\u003eRole\u003c/p\u003e\u003cp style=\"font-weight:700;font-size:18px;margin-top:4px\"\u003eUI/UX Designer\u003c/p\u003e\u003c/div\u003e\u003cdiv style=\"padding:20px 24px\"\u003e\u003cp style=\"font-size:13px;color:#555\"\u003eTimeline\u003c/p\u003e\u003cp style=\"font-weight:700;font-size:18px;margin-top:4px\"\u003eJune 2022 – June 2026\u003c/p\u003e\u003c/div\u003e\u003cdiv style=\"padding:20px 24px\"\u003e\u003cp style=\"font-size:13px;color:#555\"\u003eTeam\u003c/p\u003e\u003cp style=\"font-weight:700;font-size:18px;margin-top:4px\"\u003eSquad of 6–9 people\u003c/p\u003e\u003c/div\u003e\u003cdiv style=\"padding:20px 24px\"\u003e\u003cp style=\"font-size:13px;color:#555\"\u003ePlatform\u003c/p\u003e\u003cp style=\"font-weight:700;font-size:18px;margin-top:4px\"\u003eResponsive website\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\n\u003csection id=\"description\" style=\"max-width:1120px;margin:0 auto;padding:96px 32px;scroll-margin-top:0px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:32px 64px\"\u003e\u003cdiv\u003e\u003cp style=\"font-size:13px;font-weight:700;color:#0C7BD1\"\u003e01 · OVERVIEW\u003c/p\u003e\u003ch2 style=\"margin-top:8px;font-size:36px;line-height:1.15\"\u003eAbout the business\u003c/h2\u003e\u003c/div\u003e\n\u003cdiv style=\"grid-column:span 2;min-width:0\"\u003e\u003cp style=\"font-size:20px;line-height:1.6;color:#222\"\u003ePinket is a B2B2C financial wallet for organizational welfare. It connects organizations, their employees, and retail partners through digital wallets, credit, online shopping, and in-store purchases. It pivoted from an online chain-store to this model, and three large organizations were set to bring about 4 million users, with roughly 2000 billion Toman (about $10M) a month in potential.\u003c/p\u003e\u003cp style=\"margin-top:20px;font-size:18px;line-height:1.6;color:#444\"\u003ePinket has three dashboards: one for admins, one for vendors (markets), and one for organizations. The team behind them focused on financial transactions, making them safe, clear, and automatic. I owned the design files and approved internal design decisions, and although I focused mainly on the customer app, I strongly influenced the dashboards’ design systems and overall workflow. My work covered:\u003c/p\u003e\n\u003cdiv style=\"margin-top:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px\"\u003e\u003cdiv class=\"ch\"\u003e\u003cb style=\"background: rgb(242, 78, 30); width: 24px; min-width: 24px\"\u003e1\u003c/b\u003eUpdate Admin dashboard aligned with technical refactoring, while making sure it is compatible with other operators on other panels.\u003c/div\u003e\u003cdiv class=\"ch\"\u003e\u003cb style=\"background: rgb(162, 89, 255); width: 24px; min-width: 24px\"\u003e2\u003c/b\u003eVendor\u0027s Panel: A SaaS for creating and managing orders \u0026amp; stocks for online or in-store shopping via pinket.\u003c/div\u003e\u003cdiv class=\"ch\"\u003e\u003cb style=\"background: rgb(10, 207, 131); min-width: 24px\"\u003e3\u003c/b\u003eOrganization dashboard: For maintaining Employees \u0026amp; Their credit\u003c/div\u003e\u003cdiv class=\"ch\"\u003e\u003cb style=\"background: #1ABCFE; width: 24px; flex-direction: row; min-width: 24px\"\u003e4\u003c/b\u003eSmart contract maker (vendor commission)\u003c/div\u003e\u003cdiv class=\"ch\"\u003e\u003cb style=\"background: rgb(255, 114, 98); min-width: 24px\"\u003e5\u003c/b\u003eResponsive redesign for better moderation\u003c/div\u003e\u003cdiv class=\"ch\"\u003e\u003cb style=\"background: rgb(30, 30, 30); min-width: 24px\"\u003e6\u003c/b\u003eUpdating design system (UntitledUI-based) \u0026amp; For scaling all 3 panels.\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\n\u003cdiv class=\"iw\"\u003e\u003cdiv class=\"ibw\"\u003e\u003cdiv class=\"ib\"\u003e\u003c/div\u003e\u003c/div\u003e\u003csection id=\"impact\" style=\"position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:96px 32px;scroll-margin-top:0px\"\u003e\u003cdiv class=\"stk\"\u003e\u003cdiv\u003e\u003cdiv style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\"\u003e\u003cp class=\"i-lb\" style=\"font-size:13px;font-weight:700\"\u003e02 · IMPACT\u003c/p\u003e\u003c/div\u003e\u003ch2 class=\"i-t1\" style=\"margin-top:8px;font-size:36px\"\u003eImpact at a glance\u003c/h2\u003e\u003cp class=\"i-t2\" style=\"margin-top:12px;font-size:18px;line-height:1.55\"\u003eI rebuilt the design system behind three dashboards so they could scale, and made them responsive. Components and colors stopped being daily design work, and developers reused elements instead of building new UI each time.\u003c/p\u003e\u003cdiv class=\"ims\" style=\"margin-top:32px\"\u003e\u003cdiv class=\"is-desc\"\u003e\u003cp class=\"k0\" style=\"font-size:13px;font-weight:700\"\u003eMETRIC 1 OF 4\u003c/p\u003e\u003ch3 class=\"i-t1\" style=\"margin-top:8px;font-size:28px;line-height:1.2\"\u003eUI implementation cases dropped by 90%\u003c/h3\u003e\u003cp class=\"i-t2\" style=\"margin-top:12px;font-size:17px;line-height:1.6\"\u003eHaving 3 large products with different users could confuse any designer working on task in any of the products. Creating a unified library erased the confusion phase. We no longer needed to look back to previous designs to make sure things are consistent.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"is-desc\"\u003e\u003cp class=\"k1\" style=\"font-size:13px;font-weight:700\"\u003eMETRIC 2 OF 4\u003c/p\u003e\u003ch3 class=\"i-t1\" style=\"margin-top:8px;font-size:28px;line-height:1.2\"\u003eFaster UI implementation Helped us Focus more on UX\u003c/h3\u003e\u003cp class=\"i-t2\" style=\"margin-top:12px;font-size:17px;line-height:1.6\"\u003eWith conducted an inside research, measuring time and effort for delivering high-fidelity design. Same people could do much more and think for better solutions and test it much faster than before.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"is-desc\"\u003e\u003cp class=\"k2\" style=\"font-size:13px;font-weight:700\"\u003eMETRIC 3 OF 4\u003c/p\u003e\u003ch3 class=\"i-t1\" style=\"margin-top:8px;font-size:28px;line-height:1.2\"\u003eSize of the library, its learning curve \u0026amp; its Scalabilty\u003c/h3\u003e\u003cp class=\"i-t2\" style=\"margin-top:12px;font-size:17px;line-height:1.6\"\u003eWith a multi-dimensional design system, switching between sub-brands and themes made one problem go away. Files got lighter, \u0026amp; many of redundant components got dismissed. While also gives us the ability to Finally deliver a responsive view in much faster way than just creating new designs in mobile view.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"is-desc\"\u003e\u003cp class=\"k3\" style=\"font-size:13px;font-weight:700\"\u003eMETRIC 4 OF 4\u003c/p\u003e\u003ch3 class=\"i-t1\" style=\"margin-top:8px;font-size:28px;line-height:1.2\"\u003eTask Duration for integrating contracts with vendors\u003c/h3\u003e\u003cp class=\"i-t2\" style=\"margin-top:12px;font-size:17px;line-height:1.6\"\u003eReducing integration time from 20 to only 5 days (from dealing to shipping their shopping page) by creating a contract tool that translates complex commission policies into code queries. We studied 20 contracts \u0026amp; managed to model a 5 dimensional model. reducing the time for developing proper queries for each exception and making it fully automatic, covering 95% cases.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"pgrail\" style=\"display:flex;align-items:center;gap:16px;margin-top:8px\"\u003e\u003cdiv style=\"flex:1;display:flex;gap:6px\"\u003e\u003ci class=\"pg\"\u003e\u003c/i\u003e\u003ci class=\"pg\"\u003e\u003c/i\u003e\u003ci class=\"pg\"\u003e\u003c/i\u003e\u003ci class=\"pg\"\u003e\u003c/i\u003e\u003c/div\u003e\u003cspan class=\"pgc i-t3\" style=\"font-size:13px;font-weight:700;font-variant-numeric:tabular-nums\"\u003e01 / 04\u003c/span\u003e\u003c/div\u003e\u003cp class=\"pgrail i-t3\" style=\"margin-top:16px;font-size:13px\"\u003eExample metrics. Replace with your own. Keep scrolling to move through them.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"cms\"\u003e\u003cdiv class=\"im\"\u003e\u003cp class=\"fl i-t3\"\u003eMetric 1\u003c/p\u003e\u003cdiv style=\"position:relative;background:#fff;border-radius:16px;border:1px solid #E5E5E5;box-shadow:0 24px 48px rgba(0,0,0,.12);overflow:hidden;padding:36px 28px 28px;height:300px;box-sizing:border-box;display:flex;flex-direction:column\"\u003e\u003cdiv style=\"position:absolute;left:0;right:0;top:0;height:16px;background:#0D99FF\"\u003e\u003c/div\u003e\u003cdiv style=\"display:flex;justify-content:space-between;align-items:center\"\u003e\u003cspan class=\"tg\" style=\"background:#0D99FF26;color:#0C7BD1\"\u003e● UI implementation\u003c/span\u003e\u003cspan style=\"font-size:13px;color:#777\"\u003e[Period]\u003c/span\u003e\u003c/div\u003e\u003cp style=\"margin:auto 0 0;font-size:clamp(72px,10vw,120px);font-weight:700;line-height:1;letter-spacing:-.03em;color:#0C7BD1\"\u003e−90%\u003c/p\u003e\u003cp style=\"margin-top:8px;color:#444\"\u003eUI implementation cases\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"im\"\u003e\u003cp class=\"fl i-t3\"\u003eMetric 2\u003c/p\u003e\u003cdiv style=\"position:relative;background:#fff;border-radius:16px;border:1px solid #E5E5E5;box-shadow:0 24px 48px rgba(0,0,0,.12);overflow:hidden;padding:36px 28px 28px;height:300px;box-sizing:border-box;display:flex;flex-direction:column\"\u003e\u003cdiv style=\"position:absolute;left:0;right:0;top:0;height:16px;background:#A259FF\"\u003e\u003c/div\u003e\u003cdiv style=\"display:flex;justify-content:space-between;align-items:center\"\u003e\u003cspan class=\"tg\" style=\"background:#A259FF26;color:#8A3FF0\"\u003e● Design process\u003c/span\u003e\u003cspan style=\"font-size:13px;color:#777\"\u003e[Period]\u003c/span\u003e\u003c/div\u003e\u003cp style=\"margin:auto 0 0;font-size:clamp(72px,10vw,120px);font-weight:700;line-height:1;letter-spacing:-.03em;color:#8A3FF0\"\u003e5 times\u003c/p\u003e\u003cp style=\"margin-top:8px;color:#444\"\u003eFaster generating a UI for tasks.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"im\"\u003e\u003cp class=\"fl i-t3\"\u003eMetric 3\u003c/p\u003e\u003cdiv style=\"position:relative;background:#fff;border-radius:16px;border:1px solid #E5E5E5;box-shadow:0 24px 48px rgba(0,0,0,.12);overflow:hidden;padding:36px 28px 28px;height:300px;box-sizing:border-box;display:flex;flex-direction:column\"\u003e\u003cdiv style=\"position:absolute;left:0;right:0;top:0;height:16px;background:#0ACF83\"\u003e\u003c/div\u003e\u003cdiv style=\"display:flex;justify-content:space-between;align-items:center\"\u003e\u003cspan class=\"tg\" style=\"background:#0ACF8326;color:#07875A\"\u003e● Dashboards unified\u003c/span\u003e\u003cspan style=\"font-size:13px;color:#777\"\u003eApr – Jun 2025\u003c/span\u003e\u003c/div\u003e\u003cp style=\"margin:auto 0 0;font-size:clamp(72px,10vw,120px);font-weight:700;line-height:1;letter-spacing:-.03em;color:#07875A\"\u003e-%67\u003c/p\u003e\u003cp style=\"margin-top:8px;color:#444\"\u003eSize of library and components.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"im\"\u003e\u003cp class=\"fl i-t3\"\u003eMetric 4\u003c/p\u003e\u003cdiv style=\"position:relative;background:#fff;border-radius:16px;border:1px solid #E5E5E5;box-shadow:0 24px 48px rgba(0,0,0,.12);overflow:hidden;padding:36px 28px 28px;height:300px;box-sizing:border-box;display:flex;flex-direction:column\"\u003e\u003cdiv style=\"position:absolute;left:0;right:0;top:0;height:16px;background:#F24E1E\"\u003e\u003c/div\u003e\u003cdiv style=\"display:flex;justify-content:space-between;align-items:center\"\u003e\u003cspan class=\"tg\" style=\"background:#F24E1E26;color:#E03E12\"\u003e● Contract maker\u003c/span\u003e\u003cspan style=\"font-size:13px;color:#777\"\u003e[Period]\u003c/span\u003e\u003c/div\u003e\u003cdiv style=\"box-sizing: border-box; display: flex; flex-direction: row; margin-top: 61px; gap: 12px\"\u003e\u003cp style=\"margin: auto 0 0; font-size: clamp(72px,10vw,120px); font-weight: 700; line-height: 1; letter-spacing: -.03em; color: #E03E12\"\u003e4\u003c/p\u003e\u003cp style=\"margin: auto 0 0; font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -.03em; color: #E03E12\"\u003etimes\u003c/p\u003e\u003c/div\u003e\u003cp style=\"margin-top:8px;color:#444\"\u003eFaster making contracts with new vendors\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"spc\" style=\"height:1380px\"\u003e\u003c/div\u003e\u003c/section\u003e\u003c/div\u003e\u003csection id=\"timeline\" style=\"max-width:1120px;margin:0 auto;padding:96px 32px;scroll-margin-top:0px;padding-top:96px\"\u003e\u003cp style=\"font-size:13px;font-weight:700;color:#8A3FF0\"\u003e03 · TIMELINE\u003c/p\u003e\u003ch2 style=\"margin:8px 0 40px;font-size:36px\"\u003eHow the work evolved\u003c/h2\u003e\n\u003cdiv style=\"margin-left:8px;padding-left:32px;border-left:2px solid #D0D0D0;display:flex;flex-direction:column;gap:40px\"\u003e\u003cdiv style=\"position:relative\"\u003e\u003ci style=\"position:absolute;left:-41px;top:4px;width:16px;height:16px;border-radius:50%;background:#F24E1E;border:3px solid #F5F5F5\"\u003e\u003c/i\u003e\u003cp style=\"font-size:13px;font-weight:700;color:#555\"\u003eJune 2021 · Developer\u003c/p\u003e\u003ch3 style=\"margin-top:4px;font-size:24px\"\u003eJoined Pinket as a backend and full-stack developer\u003c/h3\u003e\u003cp style=\"margin-top:8px;font-size:17px;line-height:1.55;color:#444;max-width:640px\"\u003eBuilt backend features with Java and PostgreSQL, working with APIs, business logic, and data architecture, then expanded into React.js.\u003c/p\u003e\u003c/div\u003e\u003cdiv style=\"position:relative\"\u003e\u003ci style=\"position:absolute;left:-41px;top:4px;width:16px;height:16px;border-radius:50%;background:#A259FF;border:3px solid #F5F5F5\"\u003e\u003c/i\u003e\u003cp style=\"font-size:13px;font-weight:700;color:#555\"\u003eJune 2022 · Designer\u003c/p\u003e\u003ch3 style=\"margin-top:4px;font-size:24px\"\u003eMoved into UI/UX design\u003c/h3\u003e\u003cp style=\"margin-top:8px;font-size:17px;line-height:1.55;color:#444;max-width:640px\"\u003eTook over product design across B2B and B2C products and became the owner of all design files and the approver of internal design decisions.\u003c/p\u003e\u003c/div\u003e\u003cdiv style=\"position:relative\"\u003e\u003ci style=\"position:absolute;left:-41px;top:4px;width:16px;height:16px;border-radius:50%;background:#0ACF83;border:3px solid #F5F5F5\"\u003e\u003c/i\u003e\u003cp style=\"font-size:13px;font-weight:700;color:#555\"\u003e[Year] · First theme\u003c/p\u003e\u003ch3 style=\"margin-top:4px;font-size:24px\"\u003eUpdated the first dashboards theme\u003c/h3\u003e\u003cp style=\"margin-top:8px;font-size:17px;line-height:1.55;color:#444;max-width:640px\"\u003eRefreshed the original dashboard theme and workflows. [Add what changed and the outcome.]\u003c/p\u003e\u003c/div\u003e\u003cdiv style=\"position:relative\"\u003e\u003ci style=\"position:absolute;left:-41px;top:4px;width:16px;height:16px;border-radius:50%;background:#1ABCFE;border:3px solid #F5F5F5\"\u003e\u003c/i\u003e\u003cp style=\"font-size:13px;font-weight:700;color:#555\"\u003eApril – June 2025 · Design system\u003c/p\u003e\u003ch3 style=\"margin-top:4px;font-size:24px\"\u003eApplied UntitledUI across all dashboards\u003c/h3\u003e\u003cp style=\"margin-top:8px;font-size:17px;line-height:1.55;color:#444;max-width:640px\"\u003eRebuilt the design system for the admin, vendor, and organization dashboards. It made them responsive and easier to scale, and components and colors stopped being daily design work.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\u003csection id=\"showcase\" style=\"scroll-margin-top:0px;background-color:#1E1E1E;background-image:radial-gradient(#3A3A3A 1px,transparent 1px);background-size:24px 24px;padding:96px 0 120px\"\u003e\u003cdiv style=\"max-width:1120px;margin:0 auto;padding:0 32px\"\u003e\u003cp style=\"font-size:13px;font-weight:700;color:#1ABCFE\"\u003e04 · SHOWCASE
